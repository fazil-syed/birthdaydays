<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>✨ Happy Birthday Begum ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Nunito", "Comic Sans MS", cursive;
    background: linear-gradient(135deg, #ffe4ec, #f8e1ff, #fff5e6);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Sparkles */
  .sparkle {
    position: fixed;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%  { transform: translateY(-10px); opacity: 1; }
    100%{ transform: translateY(100vh); opacity: 0; }
  }

  /* ── START SCREEN ── */
  #start {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 60px;
    min-height: 100vh;
  }

  #start h1 {
    font-family: "Pacifico", cursive;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: #333;
    margin-bottom: 50px;
  }

  .boxes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }

  .box {
    width: 110px;
    height: 110px;
    background: #fff;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(255, 182, 193, 0.45);
    transition: transform 0.25s, box-shadow 0.25s;
    font-size: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .box:hover {
    transform: scale(1.12) rotate(-3deg);
    box-shadow: 0 8px 32px rgba(255, 120, 160, 0.4);
  }

  .box:active { transform: scale(0.96); }

  /* ── SCRAPBOOK PAGE ── */
  #page1 {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .banner {
    font-family: "Pacifico", cursive;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    background: #ffe4ec;
    padding: 12px 28px;
    border-radius: 50px;
    margin-bottom: 28px;
    box-shadow: 0 2px 12px rgba(255,150,180,0.2);
    color: #c45c82;
  }

  .photo {
    width: 220px;
    height: 220px;
    background: #fff;
    border: 2.5px dashed #f4a0c0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    font-size: 1rem;
    color: #bbb;
    flex-direction: column;
    gap: 8px;
  }

  .photo span { font-size: 2rem; }

  /* ── POPUP ── */
  #popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,220,230,0.6);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s ease;
  }

  #popup.show { display: flex; }

  .popup-box {
    background: #fff;
    border-radius: 24px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(255,100,150,0.25);
    font-size: 2rem;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .popup-box p { font-size: 1rem; color: #888; margin-top: 8px; }

  .popup-box button {
    margin-top: 18px;
    padding: 8px 24px;
    border: none;
    background: #ffb6c8;
    color: #fff;
    border-radius: 50px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.2s;
  }

  .popup-box button:hover { background: #ff85a8; }

  /* ── BUNNY (CSS only, no image) ── */
  .bunny {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 3rem;
    animation: hop 1.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes hop {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(5deg); }
  }
</style>
</head>
<body>

<!-- START -->
<div id="start">
  <h1>Open me... if you dare 👀✨</h1>
  <div class="boxes">
    <div class="box" onclick="openBox('flower','🌸','A flower, just for you!')">🌸</div>
    <div class="box" onclick="openBox('candy','🍬','Sweet treat unlocked!')">🍬</div>
    <div class="box" onclick="openBox('cat','🐱','A tiny meow surprise!')">🐱</div>
    <div class="box" onclick="openBox('star','⭐','You are a star!')">⭐</div>
    <div class="box" onclick="openMain()">💌</div>
  </div>
</div>

<!-- SCRAPBOOK PAGE -->
<div id="page1">
  <div class="banner">Your message here 💗</div>
  <div class="photo">
    <span>📷</span>
    Insert Photo
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <div id="popup-emoji"></div>
    <p id="popup-msg"></p>
    <button onclick="closePopup()">Close ✨</button>
  </div>
</div>

<!-- BUNNY -->
<div class="bunny">🐰</div>

<script>
  // Sparkles
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * -50 + "px";
    s.style.animationDuration = (3 + Math.random() * 4) + "s";
    s.style.animationDelay = (Math.random() * 5) + "s";
    s.style.width = s.style.height = (4 + Math.random() * 5) + "px";
    document.body.appendChild(s);
  }

  function openBox(type, emoji, msg) {
    document.getElementById("popup-emoji").textContent = emoji;
    document.getElementById("popup-msg").textContent = msg;
    document.getElementById("popup").classList.add("show");
  }

  function closePopup() {
    document.getElementById("popup").classList.remove("show");
  }

  function openMain() {
    document.getElementById("start").style.display = "none";
    const p = document.getElementById("page1");
    p.style.display = "flex";
  }
</script>
</body>
</html>
